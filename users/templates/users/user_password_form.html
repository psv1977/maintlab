{% extends "base.html" %}

{% block title %}Cambiar contraseña | MaintLab{% endblock %}

{% block content %}
  <main>
    <h1>Cambiar contraseña de {{ user_obj.username }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar contraseña</button>
    </form>
    <p><a href="{% url 'users:detail' user_obj.pk %}">Cancelar</a></p>
  </main>
{% endblock %}
