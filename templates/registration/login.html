{% extends "base.html" %}

{% block title %}Iniciar sesión | MaintLab{% endblock %}

{% block content %}
  <main>
    <h1>Iniciar sesión</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Ingresar</button>
    </form>
  </main>
{% endblock %}
