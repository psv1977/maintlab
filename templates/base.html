<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MaintLab{% endblock %}</title>
</head>
<body>
  <header>
    <nav aria-label="Navegación principal">
      <a href="{% url 'equipment:list' %}">Equipos</a>
      {% if user.is_authenticated %}
        <span>Sesión: {{ user.username }}</span>
      {% endif %}
    </nav>
  </header>
  {% if messages %}
    <ul aria-label="Mensajes">
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
