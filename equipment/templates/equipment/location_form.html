{% extends "base.html" %}

{% block title %}Nueva ubicación física | MaintLab{% endblock %}

{% block content %}
  <main>
    <h1>Nueva ubicación física</h1>
    <p>Registra una zona de la planta, como sala eléctrica, bodega o zona de cargadores.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar</button>
      <a href="{% url 'equipment:create' %}">Cancelar</a>
    </form>
  </main>
{% endblock %}
