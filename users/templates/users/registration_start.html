{% extends "base.html" %}

{% block title %}Registro | MaintLab{% endblock %}

{% block content %}
  <main>
    <h1>Crear cuenta</h1>
    <p>Ingrese el RUT de su empresa para continuar.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Continuar</button>
    </form>
    <p><a href="{% url 'login' %}">Volver al acceso</a></p>
  </main>
{% endblock %}
