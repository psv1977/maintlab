{% extends "base.html" %}

{% block title %}Gestionar grupos: {{ object.username }} | MaintLab{% endblock %}

{% block content %}
  <main>
    <h1>Gestionar grupos: {{ object.username }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar</button>
    </form>
    <p><a href="{% url 'users:detail' object.pk %}">Cancelar</a></p>
  </main>
{% endblock %}
